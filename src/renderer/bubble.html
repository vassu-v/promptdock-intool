<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html,body{margin:0;background:transparent;overflow:hidden;user-select:none}
  #b{width:44px;height:44px;margin:6px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
     color:#fff;
     background:linear-gradient(135deg,rgba(79,70,229,.85),rgba(124,58,237,.85) 55%,rgba(192,38,211,.85));
     box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.25);opacity:.8;transition:opacity .15s,transform .15s}
  #b:hover{opacity:1;transform:scale(1.06)}
  .mark{width:26px;height:26px}
  #b:hover .cursor{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
</style></head>
<body><div id="b" title="PromptDock: click to open, drag to move"><svg class="mark" viewBox="0 0 256 256" aria-hidden="true"><g transform="translate(6 0)"><path d="M84 192 V68 h50 a42 42 0 0 1 0 84 h-50" fill="none" stroke="currentColor" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 94 l16 16 -16 16" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><rect class="cursor" x="146" y="176" width="54" height="18" rx="9" fill="currentColor"/></g></svg></div>
<script>
  const b = document.getElementById('b');
  let down = null, moved = false;
  b.addEventListener('mousedown', (e) => { down = { x: e.screenX, y: e.screenY }; moved = false; });
  window.addEventListener('mousemove', (e) => {
    if (!down) return;
    const dx = e.screenX - down.x, dy = e.screenY - down.y;
    if (!moved && Math.hypot(dx, dy) < 4) return;
    moved = true; down = { x: e.screenX, y: e.screenY };
    window.pd.bubble.move({ dx, dy });
  });
  window.addEventListener('mouseup', () => {
    if (!down) return;
    down = null;
    if (moved) window.pd.bubble.moved(); else window.pd.bubble.click();
  });
</script></body></html>
