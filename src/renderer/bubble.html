<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html,body{margin:0;background:transparent;overflow:hidden;user-select:none}
  #b{width:44px;height:44px;margin:6px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
     font:700 15px/1 Consolas,monospace;color:#fff;letter-spacing:-1px;
     background:linear-gradient(160deg,rgba(99,102,241,.78),rgba(59,122,211,.78));
     box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.25);opacity:.55;transition:opacity .15s,transform .15s}
  #b:hover{opacity:1;transform:scale(1.06)}
</style></head>
<body><div id="b" title="PromptDock (Ctrl+Win+P) — drag to move">&gt;_</div>
<script>
  const b = document.getElementById('b');
  let down = null, moved = false;
  b.addEventListener('mousedown', (e) => { down = { x: e.screenX, y: e.screenY }; moved = false; });
  window.addEventListener('mousemove', (e) => {
    if (!down) return;
    const dx = e.screenX - down.x, dy = e.screenY - down.y;
    if (!moved && Math.hypot(dx, dy) < 4) return;
    moved = true; down = { x: e.screenX, y: e.screenY };
    window.pd.bubble.move({ dx, dy });
  });
  window.addEventListener('mouseup', () => {
    if (!down) return;
    down = null;
    if (moved) window.pd.bubble.moved(); else window.pd.bubble.click();
  });
</script></body></html>
